name: ltspice-weave-jlc-qualification

on:
  push:
    branches:
      - test/ltspice-weave-jlc-qualification
    paths:
      - "sim/tps61088_v1_3/joint/eol_1p2s.cir"
      - "sim/tps61088_v1_3/model/TPS61088_LT.LIB"
      - "hardware/ltspice-jlc-qualification/**"
      - ".github/workflows/ltspice-weave-jlc-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out power-stage baseline
        uses: actions/checkout@v4

      - name: Check out pinned Weave converter
        uses: actions/checkout@v4
        with:
          repository: senolgulgonul/weave
          ref: bc9b3d3299f3d96fae3f9a1e56de2c639e40c68a
          path: .tools/weave

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Weave CLI dependency
        working-directory: .tools/weave/cli
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Initialize isolated staging path
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE_DIR=$RUNNER_TEMP/tps61088-eol-1p2s-weave" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tps61088-eol-1p2s-weave"

      - name: Stage immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_DIR/joint" "$STAGE_DIR/model" \
            artifacts/tps61088-weave-jlc-preflight/source/joint \
            artifacts/tps61088-weave-jlc-preflight/source/model
          cp sim/tps61088_v1_3/joint/eol_1p2s.cir "$STAGE_DIR/joint/eol_1p2s.cir"
          cp sim/tps61088_v1_3/model/TPS61088_LT.LIB "$STAGE_DIR/model/TPS61088_LT.LIB"
          cp "$STAGE_DIR/joint/eol_1p2s.cir" artifacts/tps61088-weave-jlc-preflight/source/joint/
          cp "$STAGE_DIR/model/TPS61088_LT.LIB" artifacts/tps61088-weave-jlc-preflight/source/model/

      - name: Convert NET to ASC and require round-trip MATCH
        shell: bash
        run: |
          set -euo pipefail
          node .tools/weave/cli/weave.js convert \
            "$STAGE_DIR/joint/eol_1p2s.cir" \
            "$STAGE_DIR/joint/eol_1p2s.asc" 2>&1 | tee "$STAGE_DIR/weave-convert.log"
          grep -Fq "MATCH (round-trip verified)" "$STAGE_DIR/weave-convert.log"
          node .tools/weave/cli/weave.js verify \
            "$STAGE_DIR/joint/eol_1p2s.cir" \
            "$STAGE_DIR/joint/eol_1p2s.asc" | tee "$STAGE_DIR/weave-verify.log"
          grep -Fq "MATCH" "$STAGE_DIR/weave-verify.log"
          cp "$STAGE_DIR/joint/eol_1p2s.asc" artifacts/tps61088-weave-jlc-preflight/source/joint/
          cp "$STAGE_DIR/joint/"*.asy artifacts/tps61088-weave-jlc-preflight/source/joint/ 2>/dev/null || true
          cp "$STAGE_DIR/weave-convert.log" artifacts/tps61088-weave-jlc-preflight/
          cp "$STAGE_DIR/weave-verify.log" artifacts/tps61088-weave-jlc-preflight/

      - name: Validate ASC symbol references and write evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          root = Path("artifacts/tps61088-weave-jlc-preflight")
          source = root / "source"
          joint = source / "joint"
          asc = joint / "eol_1p2s.asc"
          net = joint / "eol_1p2s.cir"
          model = source / "model" / "TPS61088_LT.LIB"
          text = asc.read_text(encoding="latin-1")
          symbols = sorted(set(re.findall(r"^\s*SYMBOL\s+(\S+)", text, re.M)), key=str.lower)
          asy_files = {p.stem.lower(): p.name for p in joint.glob("*.asy")}
          lib_text = model.read_text(encoding="latin-1")
          lib_lines = lib_text.splitlines()
          sub_idx = next(i for i, line in enumerate(lib_lines)
                         if re.match(r"(?i)^\\.subckt\\s+TPS61088_TRANS\\b", line))
          subckt_header = lib_lines[sub_idx]
          for line in lib_lines[sub_idx + 1:]:
            if line.lstrip().startswith("+"):
              subckt_header += " " + line.lstrip()[1:].strip()
            else:
              break
          subckt_pins = subckt_header.split()[2:]
          x1_tokens = next(line.split() for line in net.read_text(encoding="latin-1").splitlines()
                           if line.startswith("X1 "))
          assert x1_tokens[-1].lower() == "tps61088_trans"
          x1_nodes = x1_tokens[1:-1]
          block_asy = joint / "__block21.asy"
          asy_orders = [int(x) for x in re.findall(
              r"PINATTR\\s+SpiceOrder\\s+(\\d+)", block_asy.read_text(encoding="latin-1"))]
          assert len(subckt_pins) == len(x1_nodes) == len(asy_orders), (
              f"macro-model pin mismatch: subckt={len(subckt_pins)} X1={len(x1_nodes)} ASY={len(asy_orders)}")
          assert sorted(asy_orders) == list(range(1, len(subckt_pins) + 1)), "synthetic ASY SpiceOrder is not contiguous"
          report = [
            "# Weave conversion preflight",
            "",
            "- NET to ASC: PASS",
            "- Weave round-trip connectivity: MATCH",
            f"- TPS61088 model ports / X1 call nodes / synthetic ASY pins: {len(subckt_pins)} / {len(x1_nodes)} / {len(asy_orders)} (SpiceOrder 1..{len(asy_orders)} PASS)",
            "- LTspice ASC smoke simulation: NOT RUN (no LTspice runtime in Linux CI)",
            "- JLCEDA GUI import: NOT RUN (requires local EDA application)",
            "- Production schematic / PCB readiness: NOT CLAIMED",
            "",
            "## ASC symbols",
            *[f"- {s}" for s in symbols],
            "",
            "## ASY files generated beside ASC",
            *([f"- {p.name}" for p in sorted(joint.glob("*.asy"))] or ["- none"]),
            "",
            "## Standard ASY files still required from local LTspice installation",
            *([f"- {s}.asy" for s in symbols if s.lower() not in asy_files] or ["- none"]),
            "",
            "## Engineering caveat",
            "This is the eol_1p2s.cir simulation testbench. The generated __blockN symbol is a synthetic macro-model pin carrier, not the real TPS61088 package pinout and not a PCB footprint.",
            "The existing eol_1p2s.log references work/lt_probe/TPS61088_LT.LIB; this CI run preserves the repository model file and does not claim that the old log proves this exact model copy was re-simulated.",
            "The source/ folder preserves the relative ../model/TPS61088_LT.LIB include path for local LTspice inspection.",
          ]
          (root / "conversion-report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          (root / "required-asy-symbols.txt").write_text("\n".join(symbols) + "\n", encoding="utf-8")
          def sha(p):
            h = hashlib.sha256()
            with p.open("rb") as f:
              for b in iter(lambda: f.read(1024*1024), b""):
                h.update(b)
            return h.hexdigest().upper()
          manifest = {
            "baseline_ref": "power-stage-integration",
            "baseline_commit": "360508c08f23f63cdd74fba7e0c201b0907d3825",
            "weave_commit": "bc9b3d3299f3d96fae3f9a1e56de2c639e40c68a",
            "netlist": {"file": "source/joint/eol_1p2s.cir", "sha256": sha(net)},
            "model": {"file": "source/model/TPS61088_LT.LIB", "sha256": sha(model)},
            "asc": {"file": "source/joint/eol_1p2s.asc", "sha256": sha(asc)},
            "symbols": symbols,
            "tps61088_model_pin_count": len(subckt_pins),
            "x1_call_node_count": len(x1_nodes),
            "synthetic_asy_pin_count": len(asy_orders),
            "asy_files_generated": sorted(p.name for p in joint.glob("*.asy")),
            "weave_connectivity": "MATCH",
            "ltspice_smoke": "NOT_RUN",
            "jlc_gui_import": "NOT_RUN",
            "production_ready": False,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          (cd artifacts/tps61088-weave-jlc-preflight && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload conversion and packaging preflight
        uses: actions/upload-artifact@v4
        with:
          name: tps61088-eol-1p2s-weave-jlc-preflight-${{ github.sha }}
          path: artifacts/tps61088-weave-jlc-preflight/
          if-no-files-found: error
