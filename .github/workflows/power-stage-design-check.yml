name: power-stage-design-check

on:
  push:
    branches:
      - power-stage-integration
    paths:
      - "sim/design_convergence/**"
      - "hardware/kicad/**"
      - ".github/workflows/power-stage-design-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sim/design_convergence/**"
      - "hardware/kicad/**"
      - ".github/workflows/power-stage-design-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-design-and-kicad:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run EOL power-stage budget
        run: python3 -B sim/design_convergence/power_stage_budget.py
      - name: Validate BOM, protection map, acceptance matrix, and schematic structure
        run: python3 -B sim/design_convergence/check_artifacts.py
      - name: Create KiCad artifact directory
        run: mkdir -p artifacts
      - name: Run KiCad 9 hierarchical ERC report
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            kicad-cli sch erc --severity-all --format json --output /work/artifacts/erc.json \
            hardware/kicad/supercap-ups-4s.kicad_sch
      - name: Export hierarchical netlist
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            kicad-cli sch export netlist --format kicadxml --output /work/artifacts/netlist.xml \
            hardware/kicad/supercap-ups-4s.kicad_sch
      - name: Export updated schematic PDF
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            kicad-cli sch export pdf --output /work/artifacts/supercap-ups-4s.pdf \
            hardware/kicad/supercap-ups-4s.kicad_sch
      - name: Enforce zero ERC violations
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            kicad-cli sch erc --severity-error --exit-code-violations \
            hardware/kicad/supercap-ups-4s.kicad_sch
      - name: Upload ERC, netlist, and PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-stage-kicad-validation
          path: artifacts/
          if-no-files-found: warn
