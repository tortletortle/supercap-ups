name: power-stage-design-check

on:
  push:
    branches:
      - power-stage-integration
      - p0-ov2-fault-closure
    paths:
      - "sim/design_convergence/**"
      - "sim/backup_transfer/**"
      - "hardware/kicad/**"
      - ".github/workflows/power-stage-design-check.yml"
  pull_request:
    branches:
      - main
      - power-stage-integration
    paths:
      - "sim/design_convergence/**"
      - "sim/backup_transfer/**"
      - "hardware/kicad/**"
      - ".github/workflows/power-stage-design-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-design-and-kicad:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run EOL power-stage budget
        run: python3 -B sim/design_convergence/power_stage_budget.py
      - name: Validate BOM, protection map, acceptance matrix, and schematic structure
        run: python3 -B sim/design_convergence/check_artifacts.py
      - name: Run OV2 residual-bias corners
        run: python3 -B sim/backup_transfer/check_ov2_bias.py
      - name: Run residual-IN2 route scenarios
        run: python3 -B sim/backup_transfer/check_residual_input.py
      - name: Run design-validator regression tests
        run: python3 -m unittest discover -s sim/design_convergence -p 'test_*.py' -v
      - name: Run eFuse and backup-ready tests
        run: python3 -m unittest discover -s sim/backup_transfer -p 'test_*.py' -v
      - name: Create KiCad artifact and user-config directories
        run: |
          mkdir -p artifacts "$RUNNER_TEMP/kicad-home/.config/kicad/9.0" "$RUNNER_TEMP/kicad-home/.cache/fontconfig"
      - name: Run KiCad 9 ERC, netlist, and PDF with standard libraries
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home \
            -e XDG_CONFIG_HOME=/tmp/kicad-home/.config \
            -e XDG_CACHE_HOME=/tmp/kicad-home/.cache \
            -e KICAD9_SYMBOL_DIR=/usr/share/kicad/symbols \
            -e KICAD9_FOOTPRINT_DIR=/usr/share/kicad/footprints \
            -e KICAD9_3DMODEL_DIR=/usr/share/kicad/3dmodels \
            -v "$RUNNER_TEMP/kicad-home:/tmp/kicad-home" -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            sh -lc '
              mkdir -p "$HOME/.config/kicad/9.0" "$HOME/.cache/fontconfig"
              set -e
              test -s /usr/share/kicad/template/sym-lib-table
              test -s /usr/share/kicad/template/fp-lib-table
              cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/9.0/sym-lib-table"
              cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/9.0/fp-lib-table"
              grep -q '(lib (name "Device")' "$HOME/.config/kicad/9.0/sym-lib-table"
              grep -q '(lib (name "power")' "$HOME/.config/kicad/9.0/sym-lib-table"
              echo "KiCad symbol libraries configured: $(grep -c '(lib (name' "$HOME/.config/kicad/9.0/sym-lib-table")"
              kicad-cli sch erc --severity-all --format json --output /work/artifacts/erc.json hardware/kicad/supercap-ups-4s.kicad_sch
              kicad-cli sch export netlist --format kicadxml --output /work/artifacts/netlist.xml hardware/kicad/supercap-ups-4s.kicad_sch
              kicad-cli sch export pdf --output /work/artifacts/supercap-ups-4s.pdf hardware/kicad/supercap-ups-4s.kicad_sch
              kicad-cli sch erc --severity-all --exit-code-violations hardware/kicad/supercap-ups-4s.kicad_sch
            '
      - name: Upload ERC, netlist, and PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-stage-kicad-validation
          path: artifacts/
          if-no-files-found: warn
